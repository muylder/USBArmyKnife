<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PP_Tech Army Knife</title>
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Captive Portal Login Overlay -->
  <div id="login-overlay" class="glass-overlay">
    <div class="glass-panel login-panel">
      <div class="logo-circle">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z"/></svg>
      </div>
      <h2>Secure Access</h2>
      <p>Please authenticate to access the PP_Tech Army Knife dashboard.</p>
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required autocomplete="off">
        </div>
        <div class="input-group">
          <!-- Using text input with webkit-text-security to bypass some strict HTTP password warnings -->
          <input type="text" id="password" placeholder="Password" style="-webkit-text-security: disc;" required autocomplete="off">
        </div>
        <button type="submit" class="btn-glow">Authenticate</button>
      </form>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="hidden">
    <nav class="navbar glass-nav">
      <div class="nav-brand">PP_Tech Army Knife</div>
      <div class="nav-links">
        <a href="#" class="nav-item active" data-target="tab-status">Status</a>
        <a href="#" class="nav-item" data-target="tab-commands">Commands</a>
        <a href="#" class="nav-item" data-target="tab-browser">File Browser</a>
        <a href="#" class="nav-item" data-target="tab-logs">Logs</a>
      </div>
    </nav>

    <main class="content">
      <!-- Status Tab -->
      <section id="tab-status" class="tab-content active">
        <div class="grid-cards">
          <div class="glass-card">
            <h3>Status</h3>
            <p id="status" class="highlight">Connecting...</p>
          </div>
          <div class="glass-card">
            <h3>Uptime</h3>
            <p id="uptime">Unknown</p>
          </div>
          <div class="glass-card">
            <h3>USB Mode</h3>
            <p id="USBmode">Unknown</p>
          </div>
          <div class="glass-card">
            <h3>Memory Usage</h3>
            <div class="progress-bar-container">
              <div class="progress-bar" id="heapUsage" style="width: 0%"></div>
            </div>
          </div>
          <div class="glass-card">
            <h3>SD Card</h3>
            <div class="progress-bar-container">
              <div class="progress-bar" id="sdcard_capacity" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Commands Tab -->
      <section id="tab-commands" class="tab-content">
        <div class="glass-card full-width">
          <h3>Marauder Commands</h3>
          <form action="/marauder" method="get" class="inline-form">
            <select name="marauderCmd" class="glass-select">
              <option value="stopscan">Stop Scan</option>
              <option value="attack -t beacon -l">Spam Listed SSIDs</option>
              <option value="attack -t beacon -r">Spam Random SSIDs</option>
              <option value="attack -t deauth">Deauth Target APs</option>
            </select>
            <button type="submit" class="btn-glow small">Execute</button>
          </form>
        </div>
        <div class="glass-card full-width">
          <h3>Raw Command</h3>
          <form action="/rawinput" method="get" class="inline-form">
            <input type="text" name="rawCommand" class="glass-input" placeholder="Enter command...">
            <button type="submit" class="btn-glow small">Send</button>
          </form>
        </div>
      </section>

      <!-- Browser Tab -->
      <section id="tab-browser" class="tab-content">
        <div class="glass-card full-width">
          <h3>File Manager</h3>
          <div id="tree" class="file-tree">Loading files...</div>
          <div class="file-actions">
            <input type="text" id="fileSelectionBox" class="glass-input" readonly placeholder="Select a file">
            <button class="btn-glow small" id="fileDownloadButton" onclick="window.location='/download?filename='+document.getElementById('fileSelectionBox').value">Download</button>
            <button class="btn-glow small danger" id="fileDeleteButton" onclick="window.location='/delete?filename='+document.getElementById('fileSelectionBox').value">Delete</button>
          </div>
        </div>
      </section>

      <!-- Logs Tab -->
      <section id="tab-logs" class="tab-content">
        <div class="glass-card full-width h-100">
          <h3>System Logs</h3>
          <textarea id="logBox" class="glass-textarea" readonly></textarea>
          <form action="/clearlogs" method="get">
            <button type="submit" class="btn-glow small danger mt-2">Clear Logs</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/script.min.js"></script>
</body>
</html>
